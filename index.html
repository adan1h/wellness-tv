<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Wellness TV — St. Petersburg / Tampa Bay</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="mast">
    <div class="brand">Wellness TV</div>
    <div class="ep-tag" id="epTag">Episode</div>
  </header>

  <section class="theatre">
    <aside class="strip" id="strip" aria-label="Channel wall"></aside>
    <div class="stage">
      <div class="frame">
        <img id="heroImg" alt="" />
        <div class="shade"></div>
        <button class="play" id="playBtn" type="button" aria-label="Watch">▶</button>
        <div class="lower">
          <span class="badge" id="heroBadge">REPLAY</span>
          <h1 id="heroTitle">In the Bay</h1>
          <p id="heroSub">The first shoot fills this frame.</p>
        </div>
      </div>
    </div>
    <aside class="credits" id="credits"></aside>
  </section>

  <nav class="watch" id="watch" aria-label="Watch windows"></nav>
  <section class="stills hidden" id="stillsSection">
    <h3>STILLS FROM THE SESSION</h3>
    <div class="stills-row" id="stills"></div>
  </section>
  <nav class="chips" id="chips"></nav>

  <main class="board">
    <section class="guide">
      <h3 id="guideTitle">THIS WEEK</h3>
      <div id="feed"></div>
    </section>
    <aside class="side">
      <h3>ON THE MAP</h3>
      <div id="map"></div>
    </aside>
  </main>

  <p class="legal">Public in-person sessions. Live windows open on YouTube, Kick, TikTok or X. Gallery stills are session previews — full packs come later. <a href="./admin.html">Publisher</a></p>

  <div class="sheet" id="sheet">
    <div class="sheet-card">
      <button class="close" id="closeSheet" type="button">x</button>
      <h3 id="sName"></h3>
      <p id="sWhen"></p>
      <p id="sWhere"></p>
      <p id="sPrice"></p>
      <a id="sLink" href="#" target="_blank" rel="noopener">Open crew page</a>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./data.js"></script>
  <script src="./broadcast.js"></script>
  <script src="./app.js"></script>
</body>
</html>
